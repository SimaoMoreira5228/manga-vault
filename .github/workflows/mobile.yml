name: mobile

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: flutter build apk --release
        working-directory: clients/flutter

      - name: Build App Bundle
        run: flutter build appbundle --release
        working-directory: clients/flutter

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manga-vault-android
          path: |
            clients/flutter/build/app/outputs/flutter-apk/*.apk
            clients/flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign
        working-directory: clients/flutter

      - name: Create IPA
        run: |
          cd clients/flutter/build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r ../../manga-vault-ios.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-vault-ios
          path: clients/flutter/build/manga-vault-ios.ipa
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename APK
        run: mv artifacts/manga-vault-android/*.apk manga-vault-android.apk 2>/dev/null || true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manga-vault-android.apk
          generate_release_notes: true
